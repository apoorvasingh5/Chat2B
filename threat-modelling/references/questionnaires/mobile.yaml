# Mobile Security Threat Modelling Questionnaire
- id: MOBILE-SEC-001
  question: "Does the application have a mobile component (iOS, Android, or other mobile platforms)?"
  intent: "Determine if the application has a mobile component."

- id: MOBILE-SEC-002
  question: "Does the mobile component store any form of sensitive data (e.g., personal information, authentication tokens, payment information)?"
  intent: "Check whether any sensitive information is being stored on the mobile device, which could be a potential security risk if not handled properly."

- id: MOBILE-SEC-003
  question: "Is all sensitive data stored in the app container or system credential storage of the device?"
  intent: "Verify the storage location of sensitive data to ensure it is properly secured."

- id: MOBILE-SEC-004
  question: "Is there a mechanism to enforce updates to the mobile app?"
  intent: "Verify that the application has update enforcement mechanisms to ensure users receive critical security patches and updates."

- id: MOBILE-SEC-005
  question: "What is the session management style being used (Stateful/Cookie-based or Stateless/Token-based)?"
  intent: "Understand the session management approach to evaluate authentication and state management security."

- id: MOBILE-SEC-006
  question: "Do you use a minimum device-access-security policy? How is it implemented (Biometric/App Passcode)?"
  intent: "Determine if appropriate access control mechanisms are in place to prevent unauthorized device access."

- id: MOBILE-SEC-007
  question: "Are all inputs originating from external sources and user interactions validated and sanitized (UI, IPC mechanisms such as Intents, URLs, and network-based data)?"
  intent: "Ensure that all untrusted inputs are properly validated and sanitized to prevent injection attacks and malicious payloads."

- id: MOBILE-SEC-008
  question: "Does the application detect when it is running on a rooted/jailbroken device or within an emulator, and does it take appropriate action (alerting the user or terminating the app)?"
  intent: "Verify that the application can identify compromised environments and take protective measures."

- id: MOBILE-SEC-009
  question: "Does the application detect and respond to tampering with its executable files or critical data within its sandbox, and detect widely known reverse-engineering tools or frameworks present on the device?"
  intent: "Assess runtime protection mechanisms against tampering, modification, and reverse engineering attempts."

- id: MOBILE-SEC-010
  question: "Is the keyboard cache disabled on text inputs that process sensitive data?"
  intent: "Ensure that sensitive data entered through the keyboard is not cached by the operating system."

- id: MOBILE-SEC-011
  question: "Is the screen cache disabled and no sensitive data is exposed through the user interface?"
  intent: "Verify that sensitive information is not retained in screen buffers or visible in application previews."

- id: MOBILE-SEC-012
  question: "Can sensitive data be backed up during mobile backups generated by the Operating System?"
  intent: "Check whether sensitive data protection mechanisms prevent unauthorized backup and restoration of sensitive information."

- id: MOBILE-SEC-013
  question: "Do you store sensitive information locally in the device, or is it retrieved from an endpoint?"
  intent: "Understand the data storage architecture to assess the scope of potential data exposure risks."

- id: MOBILE-SEC-014
  question: "If you do store sensitive data locally in the device, what type of encryption key is used to encrypt it and how is it generated?"
  intent: "Verify that local sensitive data is encrypted using appropriate key management practices."

- id: MOBILE-SEC-015
  question: "Is local storage wiped after an excessive number of failed authentication attempts, when jailbreaking is detected, or when device integrity violations are detected?"
  intent: "Ensure that sensitive data is securely cleared under security violation scenarios to prevent unauthorized access."

- id: MOBILE-SEC-016
  question: "Do you have mechanisms to protect against screen overlay attacks (Android)?"
  intent: "Verify that the application implements protections against UI overlay attacks that could capture sensitive user input."
